{% extends 'base.html' %} {% block title %}仪表盘 - 第六师兵团库房管理系统{%
endblock %} {% block page_title %}warehouse/菜单栏/dashboard{% endblock %} {%
block content %}
<div class="dashboard-container">
  <div class="stats-grid">
    <div class="stat-card primary">
      <div class="stat-card-icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"
          />
        </svg>
      </div>
      <div class="stat-card-content">
        <div class="stat-card-label">单位总数</div>
        <div class="stat-card-value" id="unit-count">--</div>
      </div>
    </div>

    <div class="stat-card success">
      <div class="stat-card-icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
          />
        </svg>
      </div>
      <div class="stat-card-content">
        <div class="stat-card-label">品类总数</div>
        <div class="stat-card-value" id="category-count">--</div>
      </div>
    </div>

    <div class="stat-card warning">
      <div class="stat-card-icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"
          />
        </svg>
      </div>
      <div class="stat-card-content">
        <div class="stat-card-label">品种总数</div>
        <div class="stat-card-value" id="variety-count">--</div>
      </div>
    </div>

    <div class="stat-card danger">
      <div class="stat-card-icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"
          />
        </svg>
      </div>
      <div class="stat-card-content">
        <div class="stat-card-label">出库人员总数</div>
        <div class="stat-card-value" id="stock-out-person-count">--</div>
      </div>
    </div>

    <div class="stat-card info">
      <div class="stat-card-icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <div class="stat-card-content">
        <div class="stat-card-label">今日新增品种</div>
        <div class="stat-card-value" id="today-variety-count">--</div>
      </div>
    </div>
  </div>
</div>
{% endblock %} {% block extra_js %}
<script src="/static/js/pages/dashboard.js"></script>
{% endblock %}
